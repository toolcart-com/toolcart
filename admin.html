<!doctype html>
<html lang="en" data-theme="pearl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171717" />
  <link rel="icon" href="/toolcart-v153-favicon.ico" type="image/x-icon" sizes="any" />
  <link rel="icon" href="/toolcart-v153-favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/toolcart-v153-icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/toolcart-v153-touch-180.png" sizes="180x180" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css?v=1.28" />
  <link rel="stylesheet" href="/admin-storefront.css?v=1.61" />
  <title>ToolCart Admin</title>
</head>
<body>
  
  <div id="toastHost" class="toast-host"></div>

  <main id="adminLogin" class="admin-login hidden">
    <section class="admin-login-card panel-enter">
      <div class="admin-login-brand"><img class="admin-mark" src="/toolcart-v115-symbol.png" alt="" /><div class="admin-wordmark"><img src="/toolcart-v124-wordmark.png" alt="ToolCart" /></div></div>
      <span class="eyebrow">THE DIGITAL GOODS COUNTER / CONTROL</span><h1>Administrator</h1><p>Manage your ToolCart digital storefront securely.</p>
      <form id="adminLoginForm" class="form-grid">
        <div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary">Sign in</button>
      </form>
      <button type="button" id="showAdminSetup" class="admin-setup-link">First-time administrator setup</button>
      <form id="adminSetupForm" class="form-grid admin-first-setup hidden" novalidate>
        <div class="admin-setup-note"><strong>Create the owner account once.</strong><span>Enter the temporary ADMIN_BOOTSTRAP_TOKEN you add in Cloudflare. After setup succeeds, remove that secret.</span></div>
        <div class="field"><label>Bootstrap token</label><input name="bootstrapToken" type="password" autocomplete="off" required></div>
        <div class="field"><label>Full name</label><input name="fullName" autocomplete="name" required></div>
        <div class="field"><label>Admin email</label><input name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label>Admin password</label><input name="password" type="password" minlength="12" autocomplete="new-password" required></div>
        <button class="btn btn-primary" type="submit" id="adminSetupSubmit">Create owner administrator</button>
        <div id="adminSetupStatus" class="admin-setup-status hidden" role="status" aria-live="polite"></div>
        <button type="button" id="cancelAdminSetup" class="btn btn-ghost">Back to sign in</button>
      </form>
      <a class="admin-back" href="/">Back to ToolCart</a>
    </section>
  </main>

  <main id="adminShell" class="admin-shell hidden">
    <aside id="adminSidebar" class="admin-sidebar" aria-label="Administrator navigation">
      <div class="admin-brand"><img class="admin-brand-mark" src="/toolcart-v115-symbol.png" alt=""><div class="admin-brand-copy"><div class="admin-wordmark"><img src="/toolcart-v124-wordmark.png" alt="ToolCart"></div><span>Control center</span></div><button id="adminSidebarClose" type="button" class="admin-sidebar-close" aria-label="Close navigation menu"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <nav id="adminNav">
        <button class="active" data-admin-tab="dashboard"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg></span>Dashboard</button>
        <button data-admin-tab="customers"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Customers</button>
        <button data-admin-tab="wallet"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 15h2"/></svg></span>Wallet Funding</button>
        <button data-admin-tab="apps"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h10M7 13h6"/></svg></span>Web Tools</button>
        <button data-admin-tab="services"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.5 9.5 20.5 12l-6 2.5-2.5 6-2.5-6L3.5 12l6-2.5z"/></svg></span>Premium Services</button>
        <button data-admin-tab="service_orders"><span class="admin-nav-symbol" aria-hidden="true">▤</span>Service Orders</button>
        <button data-admin-tab="providers"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M3.5 21v-2.5a5 5 0 0 1 5-5h3"/><path d="m16 17 2 2 4-4"/></svg></span>Service Providers</button>
        <button data-admin-tab="subscriptions"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18m-13 5h4"/></svg></span>Subscriptions</button>
        <button data-admin-tab="payments"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/></svg></span>Payments</button>
        <button data-admin-tab="updates"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0-11 4 4m-4-4L8 8"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></span>Updates</button>
        <button data-admin-tab="requests"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="15" rx="3"/><path d="m8 9 2 2 5-5M7 15h10"/></svg></span>Requests</button>
        <button data-admin-tab="notifications"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span>Notifications</button>
        <button data-admin-tab="analytics"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-4 3 2 5-6"/></svg></span>Analytics</button>
        <button data-admin-tab="appearance"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg></span>Appearance</button>
        <button data-admin-tab="settings"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Settings</button>
        <button data-admin-tab="audit"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h13M7 10h13M7 16h13M4 4h.01M4 10h.01M4 16h.01"/></svg></span>Audit Log</button>
        <button data-admin-tab="diagnostics"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span>Diagnostics</button>
      </nav>
      <div class="admin-sidebar-foot"><div id="adminIdentity"></div><button id="adminLogout" class="micro-btn">Sign out</button></div>
    </aside>
    <button type="button" id="adminNavScrim" class="admin-nav-scrim" aria-label="Close navigation menu" hidden></button>

    <div class="admin-main">
      <header class="admin-topbar">
        <button id="adminMenuBtn" class="icon-btn" type="button" aria-label="Open navigation menu" aria-controls="adminSidebar" aria-expanded="false"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div><span class="eyebrow">TOOLCART / ADMIN</span><h1 id="adminPageTitle">Dashboard</h1></div>
        <button id="adminRefresh" class="icon-btn" type="button" aria-label="Refresh current section"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.4 9A7 7 0 0 1 17.9 7L20 12M4 12a7 7 0 0 0 12.6 5L18 15"/></svg></button>
      </header>
      <section id="adminContent" class="admin-content"></section>
    </div>

    <nav id="adminMobileDock" class="admin-mobile-dock">
      <button class="active" data-admin-tab="dashboard"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg></span><em>Home</em></button>
      <button data-admin-tab="customers"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><em>Users</em></button>
      <button data-admin-tab="apps"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h10M7 13h6"/></svg></span><em>Web Tools</em></button>
      <button data-admin-tab="requests"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="15" rx="3"/><path d="m8 9 2 2 5-5M7 15h10"/></svg></span><em>Requests</em></button>
      <button id="adminMore"><span class="admin-nav-symbol"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg></span><em>More</em></button>
    </nav>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <section id="adminModal" class="modal detail-sheet hidden"><button class="modal-close" data-close-admin-modal>×</button><div id="adminModalContent"></div></section>
  <script type="module" src="/admin.js?v=1.61"></script>
</body>
</html>
